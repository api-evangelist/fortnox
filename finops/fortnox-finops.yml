meters:
- name: user_licenses
  description: Per-user monthly program/package licenses (SEK/user/month, excl. VAT).
  unit: users
  aggregation: sum
  dimensions:
  - tenant
  - package
- name: platform_access
  description: Base "Fortnox Access" platform fee per company/month.
  unit: months
  aggregation: sum
  dimensions:
  - tenant
- name: usage_services
  description: Usage-based add-on services such as e-invoices, payments, and interpretation.
  unit: transactions
  aggregation: sum
  dimensions:
  - tenant
  - service
- name: marketplace_revenue_share
  description: Fortnox's ~25% share of paid third-party integration revenue (developer keeps ~75%).
  unit: percent
  aggregation: max
  dimensions:
  - integration
principles:
- name: Visibility
  description: Track per-user license counts, base Access fee, and usage-service transactions per Fortnox company (tenant).
- name: Allocation
  description: Map licenses and add-on services to the teams/entities using each Fortnox company file.
- name: Optimization
  description: Right-size user seats and packages; consolidate add-on services; use the WebSocket Topics stream instead of REST polling to avoid over-provisioning integration infrastructure.
- name: Accountability
  description: Review monthly SEK license and usage charges against the Fortnox price list; for integrators, reconcile marketplace payouts net of the platform revenue share.
