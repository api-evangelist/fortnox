description: >-
  FinOps view of Fortnox spend. Fortnox is a per-user, per-month SaaS billed in
  Swedish kronor (SEK, excl. VAT): customers pay a base "Fortnox Access" fee plus
  one or more program/package licenses (bookkeeping, invoicing, salary, etc.),
  with charges scaling by users, add-on modules, and usage-based services
  (e-invoices, payments, interpretation). The API itself has no separate metered
  API fee for a customer's own use; instead, third-party integrations are
  distributed through the Fortnox marketplace under a revenue-share (the
  integrator receives ~75% of the integration's revenue, Fortnox retains ~25%
  for platform, marketing, and recommendation costs). Exact per-license SEK rates
  are not reconciled here and change frequently.
notes: >-
  Two distinct cost perspectives: (1) a Fortnox CUSTOMER pays SEK per user/month
  for licenses and add-ons; (2) an INTEGRATION DEVELOPER earns marketplace
  revenue net of Fortnox's ~25% share and pays no per-request API fee, but must
  design within the 300 req/min per-token rate limit. Verify current package
  and license pricing at https://www.fortnox.se/produkt/prislista.
