- aid: fortnox:fortnox-topics-websocket-api
  name: Fortnox Topics WebSocket API
  tags:
  - WebSocket
  - Events
  - Change Notifications
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
