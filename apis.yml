aid: fortnox
url: https://raw.githubusercontent.com/api-evangelist/fortnox/refs/heads/main/apis.yml
name: Fortnox
kind: company
description: Fortnox is a Swedish cloud accounting, ERP, and business-administration
  platform for small and medium-sized businesses and accounting bureaus. Its REST
  API at https://api.fortnox.se/3/ programmatically manages accounting and financial
  data - invoices, customers, articles, orders, offers, vouchers, accounts, suppliers,
  supplier invoices, projects, and financial years - authenticated with OAuth2
  Authorization Code Flow. Fortnox also publishes a duplex WebSocket event stream
  at wss://ws.fortnox.se/topics-v1 that pushes minimal change notifications across
  domains so integrations can react to changes instead of polling.
