apis:
- aid: fortnox:fortnox-topics-websocket-api
  name: Fortnox Topics WebSocket API
  tags:
  - WebSocket
  - Event
  - Change Notifications
  tags_raw:
  - WebSocket
  - Events
  - Change Notifications
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.fortnox.se/developer/guides-and-good-to-know/websockets
  baseURL: wss://ws.fortnox.se/topics-v1
  properties:
  - url: https://www.fortnox.se/developer/guides-and-good-to-know/websockets
    type: Documentation
  - url: asyncapi/fortnox-asyncapi.yml
    type: AsyncAPI
  description: >-
    Duplex WebSocket stream at wss://ws.fortnox.se/topics-v1 that pushes minimal change-notification events
    across domains (invoices, supplier-invoices, customers, articles, orders, offers, vouchers, projects,
    and more) so integrations react to changes instead of polling the REST API. Kafka-backed, at-least-once
    delivery, with per-topic offsets and up to 14-day replay.
