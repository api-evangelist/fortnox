    type: Documentation
  - url: asyncapi/fortnox-asyncapi.yml
    type: AsyncAPI
  description: Duplex WebSocket stream at wss://ws.fortnox.se/topics-v1 that pushes
    minimal change-notification events across domains (invoices, supplier-invoices,
    customers, articles, orders, offers, vouchers, projects, and more) so integrations
    react to changes instead of polling the REST API. Kafka-backed, at-least-once
    delivery, with per-topic offsets and up to 14-day replay.
