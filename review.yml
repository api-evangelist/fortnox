aid: fortnox
name: Fortnox
review:
  question: Does Fortnox expose a documented public WebSocket API?
  answer: true
  date: '2026-07-12'
  reviewer: API Evangelist
  asyncapiSpecCreated: true
  asyncapiScopeNote: |
    Fortnox documents a real, duplex WebSocket API at wss://ws.fortnox.se/topics-v1
    (the "Topics" service). It is a genuine WebSocket (wss://) transport - not
    SSE, long-polling, or webhooks - so under API Evangelist scope an AsyncAPI 2.6
    document was authored at asyncapi/fortnox-asyncapi.yml modeling the WebSocket
    server, the client "add-tenants-v1" subscribe command, and the pushed change
    notification event. WebSocket precision is therefore true.
findings:
  summary: |
    Yes. Fortnox exposes two distinct public API surfaces. (1) A REST API at
    https://api.fortnox.se/3/ for accounting/ERP data (invoices, customers,
    articles, orders, offers, vouchers, accounts, suppliers, supplier invoices,
    projects, financial years), authenticated with OAuth2 Authorization Code
    Flow - every request carries an Access-Token (Bearer JWT, 1h) header plus a
    Client-Secret header. (2) A documented duplex WebSocket API at
    wss://ws.fortnox.se/topics-v1 (the "Topics" service) that pushes minimal
    change-notification events per domain topic so integrations can react to
    changes instead of polling. The WebSocket is Kafka-backed, uses
    at-least-once delivery with per-topic offsets, and supports replay up to 14
    days. This is a real wss:// endpoint, so the WebSocket answer is true.
  openSource: |
    Fortnox is a proprietary commercial SaaS. There is no open-source server.
    Integration requires a registered developer application in the Fortnox
    Developer Portal, OAuth2 authorization by the end customer, and (for the
    marketplace) revenue-share terms. Fortnox publishes SDK/community client
    libraries and third-party OAuth2 strategies exist, but the platform itself
    is closed source.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.fortnox.se/3
      documented: true
      note: Primary accounting/ERP REST API. OAuth2 Authorization Code Flow; Access-Token (Bearer JWT) + Client-Secret headers on every request.
    - protocol: WebSocket
      scheme: wss
      baseURL: wss://ws.fortnox.se/topics-v1
      documented: true
      note: Real duplex WebSocket "Topics" event stream. Kafka-backed change notifications per domain topic; at-least-once delivery, per-topic offsets, up to 14-day replay. Modeled in asyncapi/fortnox-asyncapi.yml.
  endpointsConfirmedRest:
