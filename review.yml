    - GET    https://api.fortnox.se/3/invoices/{DocumentNumber}
    - PUT    https://api.fortnox.se/3/invoices/{DocumentNumber}
    - GET    https://api.fortnox.se/3/customers
    - POST   https://api.fortnox.se/3/customers
    - GET    https://api.fortnox.se/3/customers/{CustomerNumber}
    - PUT    https://api.fortnox.se/3/customers/{CustomerNumber}
    - DELETE https://api.fortnox.se/3/customers/{CustomerNumber}
    - GET    https://api.fortnox.se/3/articles
    - POST   https://api.fortnox.se/3/articles
    - GET    https://api.fortnox.se/3/articles/{ArticleNumber}
    - PUT    https://api.fortnox.se/3/articles/{ArticleNumber}
    - DELETE https://api.fortnox.se/3/articles/{ArticleNumber}
    - GET    https://api.fortnox.se/3/orders
    - POST   https://api.fortnox.se/3/orders
    - GET    https://api.fortnox.se/3/orders/{DocumentNumber}
    - PUT    https://api.fortnox.se/3/orders/{DocumentNumber}
    - GET    https://api.fortnox.se/3/offers
    - POST   https://api.fortnox.se/3/offers
    - GET    https://api.fortnox.se/3/offers/{DocumentNumber}
    - PUT    https://api.fortnox.se/3/offers/{DocumentNumber}
    - GET    https://api.fortnox.se/3/vouchers
    - POST   https://api.fortnox.se/3/vouchers
    - GET    https://api.fortnox.se/3/vouchers/{VoucherSeries}/{VoucherNumber}
    - GET    https://api.fortnox.se/3/accounts
    - POST   https://api.fortnox.se/3/accounts
    - GET    https://api.fortnox.se/3/accounts/{Number}
    - PUT    https://api.fortnox.se/3/accounts/{Number}
    - GET    https://api.fortnox.se/3/financialyears
    - POST   https://api.fortnox.se/3/financialyears
    - GET    https://api.fortnox.se/3/suppliers
    - POST   https://api.fortnox.se/3/suppliers
    - GET    https://api.fortnox.se/3/suppliers/{SupplierNumber}
    - PUT    https://api.fortnox.se/3/suppliers/{SupplierNumber}
    - GET    https://api.fortnox.se/3/supplierinvoices
    - POST   https://api.fortnox.se/3/supplierinvoices
    - GET    https://api.fortnox.se/3/supplierinvoices/{GivenNumber}
    - GET    https://api.fortnox.se/3/projects
    - POST   https://api.fortnox.se/3/projects
    - GET    https://api.fortnox.se/3/projects/{ProjectNumber}
    - PUT    https://api.fortnox.se/3/projects/{ProjectNumber}
    - DELETE https://api.fortnox.se/3/projects/{ProjectNumber}
  endpointsConfirmedWebSocket:
    - CONNECT wss://ws.fortnox.se/topics-v1
    - "SEND {\"command\":\"add-tenants-v1\", ...} to subscribe tenants/integration keys to the stream"
  oauthEndpoints:
    - GET  https://apps.fortnox.se/oauth-v1/auth
    - POST https://apps.fortnox.se/oauth-v1/token
  modeledVsConfirmed: |
    Base hosts, OAuth2 flow, the header pair (Access-Token + Client-Secret),
    rate limits, the REST resource paths above, and the WebSocket endpoint,
    subscribe command, topic list, and event shape are all confirmed from
    Fortnox's own developer documentation and live TLS/DNS probes. The
    OpenAPI document ships a solid, representative subset (a handful of the
    ~40+ REST resources) with pragmatic field-level schemas; exhaustive
    per-field property coverage for every resource is modeled/summarized, not
    transcribed field-for-field, and is flagged as such in the OpenAPI
    description. No endpoint, host, or auth mechanism in this entry is
    fabricated.
sources:
  - url: https://www.fortnox.se/developer
    type: Documentation
    note: Developer landing - OAuth2 authorization, rate limits, scopes, websockets, pricing models.
  - url: https://api.fortnox.se/apidocs
    type: APIReference
    note: Official REST API reference; base https://api.fortnox.se/3/; OpenAPI available.
  - url: https://www.fortnox.se/developer/authorization
    type: Documentation
    note: OAuth2 Authorization Code Flow; Client-Id/Client-Secret; token lifetimes (auth code 10m, access 1h, refresh 45d).
  - url: https://www.fortnox.se/developer/authorization/get-access-token
    type: Documentation
    note: Token endpoint POST https://apps.fortnox.se/oauth-v1/token; Basic auth with client credentials.
  - url: https://www.fortnox.se/developer/guides-and-good-to-know/rate-limits-for-fortnox-api
    type: Documentation
    note: 25 requests / 5s sliding window = 300 requests/minute per access-token (per client-id + tenant); 429 on exceed.
  - url: https://www.fortnox.se/developer/guides-and-good-to-know/websockets
    type: Documentation
    note: Real duplex WebSocket at wss://ws.fortnox.se/topics-v1; Kafka-backed; add-tenants-v1 command; topic list; event schema; 14-day replay.
actions:
  asyncapiPath: asyncapi/fortnox-asyncapi.yml
  apisYmlUpdated: true
  reason: |
    Fortnox exposes a genuine documented WebSocket API (wss://ws.fortnox.se/topics-v1),
    so the review answer is true and an AsyncAPI 2.6 document was authored for the
    WebSocket "Topics" event stream (server, add-tenants-v1 subscribe command, and
    pushed change-notification event). The REST accounting/ERP surface is captured
    in the OpenAPI document and the apis.yml lists both surfaces.
